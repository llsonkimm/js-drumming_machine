<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Drum Machine</title>
</head>
<body>
    <div id="drum-machine">
        <div id="pad-bank">
            <p id="display"></p>
            <div id="grid">
                
                
                <button class="drum-pad">Q
                    <audio src="https://cdn.freecodecamp.org/curriculum/drum/Heater-1.mp3" class="clip" id="Q" >Heater 1</audio>
                </button>
                <button class="drum-pad">W
                    <audio src="https://cdn.freecodecamp.org/curriculum/drum/Heater-2.mp3" class="clip" id="W">Heater 2</audio>
                </button>
                <button class="drum-pad">E
                    <audio src="https://cdn.freecodecamp.org/curriculum/drum/Heater-3.mp3" class="clip" id="E">Heater 3</audio>
                </button>
                <button class="drum-pad">A
                    <audio src="https://cdn.freecodecamp.org/curriculum/drum/Heater-4_1.mp3" class="clip" id="A">Heater 4</audio>
                </button>
                <button class="drum-pad">S
                    <audio src="https://cdn.freecodecamp.org/curriculum/drum/Heater-6.mp3" class="clip" id="S">Clap</audio>
                </button>
                <button class="drum-pad">D
                    <audio src="https://cdn.freecodecamp.org/curriculum/drum/Dsc_Oh.mp3" class="clip" id="D">Open-HH</audio>
                </button>
                <button class="drum-pad">Z
                    <audio src="https://cdn.freecodecamp.org/curriculum/drum/Kick_n_Hat.mp3" class="clip" id="Z">Kick-n'-Hat</audio>
                </button>
                <button class="drum-pad">X
                    <audio src="https://cdn.freecodecamp.org/curriculum/drum/RP4_KICK_1.mp3" class="clip" id="X">Kick</audio>
                </button>
                <button class="drum-pad">C
                    <audio src="https://cdn.freecodecamp.org/curriculum/drum/Cev_H2.mp3" class="clip" id="C">Closed-HH</audio>
                </button>
                
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
